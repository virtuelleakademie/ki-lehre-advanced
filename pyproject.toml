[project]
name = "ki-lehre-advanced"
version = "0.1.0"
description = "Advanced AI teaching materials and workshops"
requires-python = ">=3.10"
dependencies = [
    "gradio>=5.23.1",
    "ipykernel>=7.1.0",
    "ipython>=8.37.0",
    "marimo[mcp]==0.17.8",
    "openai>=1.0.0",
    "pydantic>=2.12.4",
