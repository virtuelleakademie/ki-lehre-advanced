project:
  type: website
  resources:
    - assets/*
    - assets/images/*
    - assets/essays/*
    - workshop/api-tricks/images/*
  preview:
    port: 8800
    browser: false
  output-dir: docs
  render:
    - index.qmd
    - workshop/**/*.qmd
    - workshop/**/*.ipynb
    - hf-spaces/**/*.md

website:
  title: "KI in der Lehre: Advanced"
  site-url: https://virtuelleakademie.github.io/ki-lehre-advanced/
  # repo-url: https://github.com/virtuelleakademie/cas-hochschuldidaktik/
  # repo-actions: [edit, issue]
  favicon: /assets/robot.png
  open-graph: true
  search:
    location: navbar
    type: overlay

  reader-mode: false
  page-navigation: true
  back-to-top-navigation: true

  navbar:
    background: light
    left:
      - icon: card-list
        href: workshop/index.qmd
        text: Workshop

      - icon: easel
        href: workshop/demo/index.qmd
        text: Demo

      - icon: code-square
        href: workshop/build/index.qmd
        text: Build

      - icon: people
        href: workshop/extend/index.qmd
        text: Extend

      - icon: book
        href: workshop/resources/index.qmd
        text: Resources


    tools:
      - icon: lightbulb-fill
        text: Knowledge Base
        href: https://virtuelleakademie.ch/knowledge-base/

      # - icon: github
      #   menu:
      #     - text: Source code
      #       url:  https://github.com/virtuelleakademie/cas-hochschuldidaktik/
      #     - text: Report an issue
      #       url:  https://github.com/virtuelleakademie/cas-hochschuldidaktik/issues

  sidebar:
    - title: "Workshop"
      style: "docked"
      search: true
      background: light
      contents:
        - workshop/index.qmd
        - text: "---"
        - section: "Opening (10 min)"
          contents:
            - workshop/opening/index.qmd
        - section: "Theory (30 min)"
          contents:
            - workshop/theory/index.qmd
        - section: "Demo (20 min)"
          contents:
            - workshop/demo/index.qmd
        - section: "Build (90 min)"
          contents:
            - workshop/build/index.qmd
        - section: "Extend (30 min)"
          contents:
            - workshop/extend/index.qmd
        - section: "Resources (10 min)"
          contents:
            - workshop/resources/index.qmd

page-footer:
  right:
    - icon: github
      href: https://github.com/virtuelleakademie/ki-lehre-advanced/

format:
  html:
    theme:
      light: [simplex]
    toc: true
    link-external-icon: true
    link-external-newwindow: true
    anchor-sections: true
    smooth-scroll: true
    linkcolor: rebeccapurple

comments:
  hypothesis:
    theme: clean
  # utterances:
  # repo: virtuelleakademie/promptly-literate

execute:
  cache: true
  freeze: auto
  execute-dir: project

editor:
  render-on-save: true

revealjs-plugins:
  - attribution
filters:
  - timer
  - custom-callout

custom-callout:
  # todo:
  #   icon-symbol: "📝"
  #   collapse: true
  #   color: "pink"

  # thumbs-up:
  #   title: "Great job!"
  #   icon-symbol: "👍🏼"
  #   color: "steelblue"

  # Activity Types
  individual:
    title: "Individual Work"
    icon-symbol: "💻"
    color: "steelblue"
    collapse: false

  pair:
    title: "Pair Work"
    icon-symbol: "👥"
    color: "forestgreen"
    collapse: false

  group:
    title: "Group Work"
    icon-symbol: "👥"
    color: "purple"
    collapse: false

  screens-down:
    title: "Screens Down"
    icon-symbol: "🔽"
    color: "orange"
    collapse: false

  screens-up:
    title: "Screens Up"
    icon-symbol: "🔼"
    color: "green"
    collapse: false

  # Learning Process
  try:
    title: "Try It"
    icon-symbol: "🔄"
    color: "blue"
    collapse: false

  reflect:
    title: "Reflection"
    icon-symbol: "💭"
    color: "purple"
    collapse: false

  feedback:
    title: "Feedback"
    icon-symbol: "📝"
    color: "teal"
    collapse: true

  caution:
    title: "Watch Out"
    icon-symbol: "⚠️"
    color: "orange"
    collapse: true

  pro-tip:
    title: "Pro Tip"
    icon-symbol: "💡"
    color: "gold"
    collapse: true

  # Technical Elements
  prompt-example:
    title: "Example Prompt:"
    icon-symbol: "👩🏼‍🔧"
    color: "steelblue"
    collapse: false

  tutor-example:
    title: "Tutor:"
    icon-symbol: "📄"
    color: "purple"
    collapse: false

  prompt-template:
    title: "Prompt Template"
    icon-symbol: "📋"
    color: "indigo"
    collapse: true

  testing:
    title: "Test Your Prompt"
    icon-symbol: "🧪"
    color: "green"
    collapse: false

  export:
    title: "Export"
    icon-symbol: "📤"
    color: "brown"
    collapse: true

  # Workshop Flow
  setup:
    title: "Setup"
    icon-symbol: "⚙️"
    color: "gray"
    collapse: true

  timing:
    title: "Time Check"
    icon-symbol: "⏱️"
    color: "red"
    collapse: false

  break:
    title: "Break Time"
    icon-symbol: "☕"
    color: "yellow"
    collapse: false

  checkpoint:
    title: "Checkpoint"
    icon-symbol: "🎯"
    color: "purple"
    collapse: false

  schedule:
    title: "Schedule"
    icon-symbol: "⏰︎"
    color: "steelblue"
    collapse: false

