project:
  type: website
  resources:
    - assets/*
    - assets/images/*
    - assets/essays/*
  preview:
    port: 8800
    browser: false
  output-dir: docs
  render:
    - index.qmd
    - vorbereitung/**/*.qmd
    - workshop/**/*.qmd
    - workshop/**/*.md
    - workshop/**/*.ipynb
    - slides/**/*.qmd
    - "!slides/archive/**"
    - hf-spaces/**/*.md

website:
  title: "KI in der Lehre: Advanced"
  site-url: https://virtuelleakademie.github.io/ki-lehre-advanced/
  # repo-url: https://github.com/virtuelleakademie/cas-hochschuldidaktik/
  # repo-actions: [edit, issue]
  favicon: /assets/robot.png
  open-graph: true
  search:
    location: navbar
    type: overlay

  reader-mode: false
  page-navigation: true
  back-to-top-navigation: true

  navbar:
    background: light
    left:
      - icon: card-list
        href: workshop/index.qmd
        text: Workshop
      - icon: book
        href: vorbereitung/index.qmd
        text: Vorbereitung

    right:
      - icon: folder
        text: "Ressourcen"
        menu:
          - text: "Beispiel-Spec-Card (Statistik)"
            file: workshop/spec-card-statistics/index.qmd
          - text: "Spec-Sheet-Vorlage"
            file: workshop/spec-sheet-template/index.qmd
          - text: "---"
          - text: "Backup-Szenarien"
            file: workshop/build/scenarios/index.qmd

    tools:
      - icon: lightbulb-fill
        text: Knowledge Base
        href: https://virtuelleakademie.ch/knowledge-base/

  sidebar:
    - title: "Workshop"
      style: "docked"
      search: true
      background: light
      contents:
        - section: "Einführung"
          contents:
            - vorbereitung/index.qmd
            - workshop/index.qmd
        - section: "Programm"
          contents:
            - text: "Einstieg (7 min)"
              file: workshop/einstieg/index.qmd
            - section: "Block 1: Theorie und Beispiel (45 min)"
              contents:
                - workshop/block-1-theorie-und-beispiel/index.qmd
                - workshop/block-1-theorie-und-beispiel/worked-example-statistics.qmd
                - workshop/block-1-theorie-und-beispiel/wissens-typen-mechanismen-ki.qmd
            - text: "Block 2: Eigenes Spec Sheet (60 min)"
              file: workshop/block-2-spec-card/index.qmd
            - text: "Block 3: Rendering (25 min)"
              file: workshop/block-3-multi-tool/index.qmd
            - text: "Closing (13 min)"
              file: workshop/closing/index.qmd

    - title: "Ressourcen"
      style: "docked"
      search: true
      background: light
      contents:
        - section: "Beispiel und Vorlage"
          contents:
            - text: "Beispiel-Spec-Card (Statistik)"
              file: workshop/spec-card-statistics/index.qmd
            - section: "Spec-Sheet-Vorlage"
              contents:
                - workshop/spec-sheet-template/index.qmd
                - workshop/spec-sheet-template/prompt-scaffolds.md
                - workshop/spec-sheet-template/system-prompt-template.md
        - section: "Backup-Szenarien"
          contents:
            - workshop/build/scenarios/index.qmd
            - workshop/build/scenarios/nursing.qmd
            - workshop/build/scenarios/education.qmd
            - workshop/build/scenarios/business.qmd
            - workshop/build/scenarios/social-work.qmd
            - workshop/build/scenarios/engineering.qmd
            - workshop/build/scenarios/statistics.qmd
            - workshop/build/scenarios/math.qmd

page-footer:
  right:
    - icon: github
      href: https://github.com/virtuelleakademie/ki-lehre-advanced/

format:
  html:
    theme:
      - simplex
      - styles/custom.scss
    css: styles/styles.css
    code-copy: true
    toc: true
    link-external-icon: true
    link-external-newwindow: true
    anchor-sections: true
    smooth-scroll: true
    linkcolor: "#1A1714"

comments:
  hypothesis:
    theme: clean
  # utterances:
  # repo: virtuelleakademie/promptly-literate

execute:
  cache: true
  freeze: auto
  execute-dir: project

editor:
  render-on-save: true

revealjs-plugins:
  - attribution
filters:
  - timer
  - custom-callout

custom-callout:
  # =============================================================
  # Action callouts — Terracotta (#A63D2F)
  # What participants DO
  # =============================================================
  active-processing:
    title: "Aktive Verarbeitung"
    icon-symbol: "fa-pen-to-square"
    appearance: default
    color: "#A63D2F"
    collapse: false

  individual:
    title: "Einzelarbeit"
    icon-symbol: "fa-user"
    appearance: default
    color: "#A63D2F"
    collapse: false

  pair:
    title: "Partnerarbeit"
    icon-symbol: "fa-user-group"
    appearance: default
    color: "#A63D2F"
    collapse: false

  group:
    title: "Gruppenarbeit"
    icon-symbol: "fa-users"
    appearance: default
    color: "#A63D2F"
    collapse: false

  screens-down:
    title: "Bildschirme zu"
    icon-symbol: "fa-eye-slash"
    appearance: default
    color: "#A63D2F"
    collapse: false

  screens-up:
    title: "Bildschirme auf"
    icon-symbol: "fa-eye"
    appearance: default
    color: "#A63D2F"
    collapse: false

  try:
